name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Lint + typecheck (chạy song song frontend / backend)
  # ---------------------------------------------------------------
  lint:
    name: Lint & typecheck (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: frontend
            lint: npm run lint
            typecheck: npx tsc -b
          - dir: monolith-backend
            # Thêm script "lint:ci": giống "lint" nhưng KHÔNG có --fix
            lint: npm run lint:ci
            typecheck: npx tsc --noEmit -p tsconfig.json
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - name: Prisma generate (backend cần client để typecheck)
        if: matrix.dir == 'monolith-backend'
        run: npx prisma generate
      - name: Lint
        run: ${{ matrix.lint }}
      - name: Typecheck
        run: ${{ matrix.typecheck }}

  # ---------------------------------------------------------------
  # 2a. Test backend: unit + integration + coverage
  # ---------------------------------------------------------------
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowpilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d flowpilot"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: monolith-backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # Giá trị giả chỉ dùng cho test; bổ sung các biến test cần (ví dụ khóa mã hóa)
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: monolith-backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: Unit test + coverage
        run: npm run test:cov
      - name: Integration test
        run: npm run test:integration
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: monolith-backend/coverage

  # ---------------------------------------------------------------
  # 2b. Test frontend
  # ---------------------------------------------------------------
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Cần devDependency: @vitest/coverage-v8
      - name: Unit test + coverage
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  # ---------------------------------------------------------------
  # 3. Security: quét secret + quét phụ thuộc
  # ---------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks cần toàn bộ lịch sử
      - name: Gitleaks (secret trong repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy (lỗ hổng phụ thuộc)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Bắt đầu với "0" để không làm đỏ pipeline, xử lý hết lỗi cũ rồi đổi thành "1"
          exit-code: "0"