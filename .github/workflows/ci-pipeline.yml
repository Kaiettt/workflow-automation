name: CI Pipeline

on:
  push:
    branches:
      - "master" # Runs on direct pushes to master
  pull_request:
    branches:
      - "master" # Runs on PRs opened against master
    types: [opened, synchronize, reopened]

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend (React)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend (React) CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Monolith Backend (NestJS)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend (NestJS) CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowpilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: monolith-backend

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/flowpilot?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: monolith-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm test

      - name: Build NestJS Project
        run: npm run build
